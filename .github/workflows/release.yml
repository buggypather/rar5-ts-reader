# A release: push a tag like v0.3.0 (or make a release on GitHub, which makes the tag).
# - Tests and builds both packages.
# - Publishes to npm each package whose version is new (npm "trusted publishing": no token;
#   set it up once per package on npmjs.com, see RELEASING.md).
# - Builds rar5ls for Windows, Mac and Linux and attaches them to the GitHub release.
name: Release
on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/publish-new.mjs

  programs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/binaries.mjs
      - name: Attach the programs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "$TAG" --generate-notes
          fi
